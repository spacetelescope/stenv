name: build

on:
  workflow_call:
    outputs:
      date:
        value: ${{ jobs.variables.outputs.date }}
      docker-images:
        value: ${{ jobs.variables.outputs.docker-images }}
      python-versions:
        value: ${{ jobs.variables.outputs.python-versions }}
  workflow_dispatch:
  push:
  release:
    types:
      - published

concurrency:
  group: build-${{ github.ref }}

defaults:
  run:
    shell: bash -leo pipefail {0}

jobs:
  variables:
    runs-on: ubuntu-latest
    steps:
      - id: date
        run: echo "date=$(date +%Y.%m.%d)" >> $GITHUB_OUTPUT
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: platforms
        run: |
          echo "docker-images=$(cat platforms.json | jq -c .docker_images)" >> $GITHUB_OUTPUT
          echo "python-versions=$(cat platforms.json | jq -c .python_versions)" >> $GITHUB_OUTPUT
    outputs:
      date: ${{ steps.date.outputs.date }}
      docker-images: ${{ steps.platforms.outputs.docker-images }}
      python-versions: ${{ steps.platforms.outputs.python-versions }}
  build:
    needs: [variables]
    strategy:
      fail-fast: false
      matrix:
        runs-on: ${{ fromJSON(needs.variables.outputs.docker-images) }}
        python-version: ${{ fromJSON(needs.variables.outputs.python-versions) }}
    runs-on: ${{ matrix.runs-on }}
    name: build (Python ${{ matrix.python-version }}, ${{ matrix.runs-on }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-name: stenv-${{ runner.os }}-py${{ matrix.python-version }}
          environment-file: environment.yaml
          condarc: |
            use_uv: true
          create-args: >-
            python=${{ matrix.python-version }}
          cache-environment: true
          cache-environment-key: environment-${{ matrix.python-version }}-${{ needs.variables.outputs.date }}
          init-shell: bash
          generate-run-shell: false
          post-cleanup: none
      - run: echo "filename=stenv-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python-version }}-${{ needs.variables.outputs.date }}.yaml" >> $GITHUB_OUTPUT
        id: output
      - run: |
          micromamba env export --no-build | grep -v "name:" | grep -v "prefix:" > ${{ steps.output.outputs.filename }}
          cat ${{ steps.output.outputs.filename }}
      - run: uv pip install pytest
      - run: pytest tests/test_import.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.output.outputs.filename }}
          path: ${{ steps.output.outputs.filename }}
          archive: false
      - if: (github.event_name == 'release' && github.event.action == 'published')
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # 2.11.5
        with:
          file: ${{ steps.output.outputs.filename }}
